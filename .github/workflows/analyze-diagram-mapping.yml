name: Analyze PNG to SGF diagram mapping

on:
  push:
    branches: [main]
    paths:
      - 'scripts/analyze_png_sgf.py'
      - 'tests/test_diagram_mapping.py'
      - '.github/workflows/analyze-diagram-mapping.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore cached Sensei's Library snapshot
        id: snapshot-cache
        uses: actions/cache@v4
        with:
          path: build/senseis-library.tar.bz2
          key: senseis-library-snapshot-v1

      - name: Download snapshot on cache miss
        if: steps.snapshot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build
          curl --fail --location --show-error --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 7200 https://senseis.xmp.net/files/snapshots/senseis-library.tar.bz2 --output build/senseis-library.tar.bz2

      - name: Verify snapshot archive
        run: |
          test -s build/senseis-library.tar.bz2
          bzip2 -t build/senseis-library.tar.bz2
          du -h build/senseis-library.tar.bz2

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Analyze every PNG and SGF reference
        run: |
          python scripts/analyze_png_sgf.py --archive build/senseis-library.tar.bz2 --report build/png-sgf-mapping.json

      - name: Upload complete mapping report
        uses: actions/upload-artifact@v4
        with:
          name: png-sgf-mapping-analysis
          path: build/png-sgf-mapping.json
          if-no-files-found: error
          retention-days: 30
