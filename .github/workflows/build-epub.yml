name: Build Sensei's Library EPUB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: senseis-epub
  cancel-in-progress: true

jobs:
  build:
    name: Download snapshot and build EPUB
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install converter dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Download Sensei's Library snapshot
        env:
          SNAPSHOT_URL: https://senseis.xmp.net/files/snapshots/senseis-library.tar.bz2
        run: |
          mkdir -p build dist
          curl --fail --location --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --connect-timeout 30 --max-time 3600 \
            "$SNAPSHOT_URL" \
            --output build/senseis-library.tar.bz2
          test -s build/senseis-library.tar.bz2
          echo "Snapshot archive: $(du -h build/senseis-library.tar.bz2 | cut -f1)"

      - name: Convert snapshot to EPUB
        run: |
          python scripts/build_epub.py \
            --archive build/senseis-library.tar.bz2 \
            --output dist/senseis-library.epub

      - name: Summarize output
        run: |
          {
            echo "## Sensei's Library EPUB"
            echo
            echo "- File: `senseis-library.epub`"
            echo "- Size: $(du -h dist/senseis-library.epub | cut -f1)"
            echo "- SHA-256: `$(sha256sum dist/senseis-library.epub | cut -d' ' -f1)`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: senseis-library-epub
          path: dist/senseis-library.epub
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
