name: Build Sensei's Library Android app and SQLite database

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/build_android.sh'
      - 'scripts/build_database.py'
      - 'scripts/analyze_snapshot.py'
      - 'requirements.txt'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: senseis-offline-library
  cancel-in-progress: true

jobs:
  build:
    name: Analyze snapshot, build SQLite database and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Delete artifacts from all previous workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            let deleted = 0;
            for (let i = 0; i < artifacts.length; i += 10) {
              const batch = artifacts.slice(i, i + 10);
              await Promise.all(batch.map(async artifact => {
                try {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id
                  });
                  deleted++;
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }));
            }
            const message = "Deleted " + deleted + " artifacts from previous runs.";
            core.notice(message);
            core.info(message);

      - name: Install WebP encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends webp
          cwebp -version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore cached Sensei's Library snapshot
        id: snapshot-cache
        uses: actions/cache@v4
        with:
          path: build/senseis-library.tar.bz2
          key: senseis-library-snapshot-v1

      - name: Download Sensei's Library snapshot (cache miss only)
        if: steps.snapshot-cache.outputs.cache-hit != 'true'
        env:
          SNAPSHOT_URL: https://senseis.xmp.net/files/snapshots/senseis-library.tar.bz2
        run: |
          mkdir -p build dist
          curl --fail --location --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 --max-time 7200 \
            "$SNAPSHOT_URL" --output build/senseis-library.tar.bz2

      - name: Verify cached snapshot archive
        run: |
          test -s build/senseis-library.tar.bz2
          bzip2 -t build/senseis-library.tar.bz2
          echo "Snapshot archive: $(du -h build/senseis-library.tar.bz2 | cut -f1)"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Analyze and extract only a small sample of the real snapshot
        run: |
          python scripts/analyze_snapshot.py \
            --archive build/senseis-library.tar.bz2 \
            --sample-dir build/page-sample \
            --report build/snapshot-analysis.json \
            --max-members 15000 \
            --max-pages 80

      - name: Build complete SQLite library (streaming, no full extraction)
        run: |
          python scripts/build_database.py \
            --archive build/senseis-library.tar.bz2 \
            --output dist/senseis.db \
            --summary build/database-summary.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK cache paths
        run: mkdir -p "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/platforms/android-35" "$ANDROID_HOME/build-tools/35.0.0" "$ANDROID_HOME/licenses" "$HOME/.android/cache"

      - name: Cache Android SDK command-line tools, platform and build tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/cmdline-tools
            ${{ env.ANDROID_HOME }}/platforms/android-35
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0
            ${{ env.ANDROID_HOME }}/licenses
            ~/.android/cache
          key: android-sdk-cli-platform-35-build-tools-35.0.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Install Android platform and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build and sign standalone Android app
        env:
          ANDROID_API: '35'
          BUILD_TOOLS_VERSION: '35.0.0'
        run: bash scripts/build_android.sh

      - name: Write build summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          analysis = json.loads(Path('build/snapshot-analysis.json').read_text())
          database = json.loads(Path('build/database-summary.json').read_text())
          lines = [
              "## Sensei's Library offline Android build",
              "",
              f"- Snapshot archive: {Path('build/senseis-library.tar.bz2').stat().st_size:,} bytes",
              f"- Sample scan: {analysis['members_scanned']:,} archive members; {analysis['sampled_pages']:,} HTML pages extracted for analysis",
              f"- SQLite database: {database['files']:,} files; {database['pages']:,} wiki pages; {database['sgf_files']:,} SGF files",
              f"- Database size: {database['database_bytes']:,} bytes",
              f"- Database schema: {database.get('schema_version', 'unknown')}",
              f"- Images removed (>500 KiB): {database['images_removed']:,} ({database['image_bytes_removed']:,} source bytes)",
              f"- PNGs converted to lossy WebP: {database.get('webp_converted', 0):,}/{database.get('png_files_seen', 0):,}; bytes saved: {database.get('webp_bytes_saved', 0):,}; unchanged: {database.get('webp_not_smaller', 0):,}; warnings: {database.get('webp_conversion_warnings', 0):,}",
              f"- Database build time: {database['seconds']} seconds",
              f"- Android APK: {Path('app/build/SenseisLibrary.apk').stat().st_size:,} bytes",
              "",
              "Download both artifacts: install the APK, then open the app and import `senseis.db` using the Android file picker.",
          ]
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines) + '\n')
          PY

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: senseis-android-app
          path: app/build/SenseisLibrary.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload complete offline SQLite database
        uses: actions/upload-artifact@v4
        with:
          name: senseis-offline-database
          path: dist/senseis.db
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload snapshot structure analysis
        uses: actions/upload-artifact@v4
        with:
          name: senseis-snapshot-analysis
          path: |
            build/snapshot-analysis.json
            build/database-summary.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
